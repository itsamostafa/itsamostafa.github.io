<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
(function(){
  // Flag JS availability so reveal animations never hide content without it
  document.documentElement.classList.add('js');

  // Never show /index.html in the address bar
  try{
    if(location.pathname.slice(-11) === '/index.html'){
      history.replaceState(null, '', location.pathname.slice(0, -10) + location.search + location.hash);
    }
  }catch(e){}

  try{
    var t = localStorage.getItem('theme');
    if(t === 'light' || t === 'dark'){ document.documentElement.setAttribute('data-theme', t); }
  }catch(e){}

  var path = location.pathname;

  // Old nested post URLs: /blog/<anything>/<slug>/ -> /writing/<slug>/
  var nested = path.match(/^\/(?:blog|writing)\/[^/]+\/([^/]+)\/?$/);
  if(nested){ location.replace('/writing/' + nested[1] + '/'); return; }

  // Old single-page anchors and stray paths -> the page that now owns them
  var slug = path.replace(/^\/|\/$/g, '').replace(/\.html$/, '').toLowerCase();
  var MAP = {
    'about': '/', 'home': '/', 'index': '/',
    'work': '/work/', 'projects': '/work/', 'portfolio': '/work/', 'case-studies': '/work/',
    'writing': '/writing/', 'blog': '/writing/', 'notes': '/writing/',
    'experience': '/experience/', 'resume': '/experience/', 'cv': '/experience/',
    'contact': '/contact/', 'hire': '/contact/'
  };
  if(MAP[slug]){ location.replace(MAP[slug]); }
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Ahmed Mostafa</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">

</style>
</head>

    <a class="tab" href="/contact/" data-path="/contact/">Contact</a>
  </nav>
  <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode" type="button">
    <svg class="sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
